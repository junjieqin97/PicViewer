[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picviewer"
version = "0.1.0"
description = "A desktop photo viewer."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
authors = [{ name = "PicViewer Team" }]
dependencies = [
  "PyQt5>=5.15",
  "opencv-python>=4.7",
  "numpy>=1.23",
  "Pillow>=10.0",
]

[project.optional-dependencies]
raw = ["rawpy>=0.17"]
packaging = [
  "build>=1.2",
  "twine>=5.0",
  "pyinstaller>=6.0",
  "rawpy>=0.17",
]

[project.scripts]
picviewer = "pic_viewer.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pic_viewer = [
  "ui/resources/i18n/*.ts",
  "ui/resources/i18n/*.qm",
  "ui/resources/styles/*.qss",
]

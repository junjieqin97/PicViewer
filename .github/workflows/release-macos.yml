name: Release macOS DMG

on:
  pull_request:
    types:
      - closed
    branches:
      - 'release-*'

permissions:
  contents: write

jobs:
  release-macos:
    name: Build and publish macOS DMG
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: PicViewer
          python-version: "3.10"
          channels: conda-forge
          channel-priority: strict

      - name: Install packaging dependencies
        run: |
          brew install inih
          conda install -y -c conda-forge pyside2
          python -m pip install --upgrade pip
          python -m pip install -e ".[packaging]"

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit

      - name: Build macOS app
        run: python scripts/packaging/build_app.py

      - name: Build macOS DMG
        run: python scripts/packaging/build_dmg.py

      - name: Verify DMG checksum
        working-directory: dist
        run: shasum -a 256 -c *.dmg.sha256

      - name: Read release version
        id: release
        run: |
          VERSION="$(python - <<'PY'
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          with Path("pyproject.toml").open("rb") as file_obj:
              print(tomllib.load(file_obj)["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/PicViewer-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/PicViewer-$VERSION.dmg.sha256" >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump pyproject.toml project.version before re-running."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.dmg }}#PicViewer ${{ steps.release.outputs.version }} macOS arm64 DMG" \
            "${{ steps.release.outputs.checksum }}#PicViewer ${{ steps.release.outputs.version }} macOS arm64 SHA256" \
            --target "${{ github.sha }}" \
            --title "PicViewer ${{ steps.release.outputs.version }}" \
            --generate-notes
